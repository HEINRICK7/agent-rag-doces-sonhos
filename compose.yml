version: "3.9"

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minio-secret}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-secret}"
      MINIO_BUCKET: "${MINIO_BUCKET:-products}"
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-secret}"
      MINIO_SECURE: "false"
      MINIO_BUCKET: "${MINIO_BUCKET:-products}"
      EXTERNAL_API_BASE_URL: "${EXTERNAL_API_DOCKER_BASE_URL:-http://host.docker.internal:3002}"
      EXTERNAL_API_PRODUCTS_PATH: "${EXTERNAL_API_PRODUCTS_PATH:-/products}"
      EXTERNAL_API_AUTH_MODE: "${EXTERNAL_API_AUTH_MODE:-none}"
      EXTERNAL_API_TOKEN: "${EXTERNAL_API_TOKEN:-}"
      EXTERNAL_API_API_KEY_HEADER: "${EXTERNAL_API_API_KEY_HEADER:-X-API-Key}"
      EXTERNAL_API_TIMEOUT_SECONDS: "${EXTERNAL_API_TIMEOUT_SECONDS:-10}"
      EXTERNAL_API_RETRY_ATTEMPTS: "${EXTERNAL_API_RETRY_ATTEMPTS:-3}"
      EXTERNAL_API_RETRY_BACKOFF_SECONDS: "${EXTERNAL_API_RETRY_BACKOFF_SECONDS:-0.25}"
      EXTERNAL_API_MAX_RETRY_DELAY: "${EXTERNAL_API_MAX_RETRY_DELAY:-5}"
      EXTERNAL_API_PAGINATION_MODE: "${EXTERNAL_API_PAGINATION_MODE:-none}"
      EXTERNAL_API_PAGE_SIZE: "${EXTERNAL_API_PAGE_SIZE:-100}"
      EXTERNAL_API_MAX_PAGES: "${EXTERNAL_API_MAX_PAGES:-1000}"
      EXTERNAL_API_PAGE_PARAM: "${EXTERNAL_API_PAGE_PARAM:-page}"
      EXTERNAL_API_OFFSET_PARAM: "${EXTERNAL_API_OFFSET_PARAM:-offset}"
      EXTERNAL_API_LIMIT_PARAM: "${EXTERNAL_API_LIMIT_PARAM:-limit}"
      EXTERNAL_API_CURSOR_PARAM: "${EXTERNAL_API_CURSOR_PARAM:-cursor}"
      EXTERNAL_API_ITEMS_KEY: "${EXTERNAL_API_ITEMS_KEY:-items}"
      EXTERNAL_API_HAS_MORE_KEY: "${EXTERNAL_API_HAS_MORE_KEY:-has_more}"
      EXTERNAL_API_NEXT_CURSOR_KEY: "${EXTERNAL_API_NEXT_CURSOR_KEY:-next_cursor}"
      EXTERNAL_API_TOTAL_KEY: "${EXTERNAL_API_TOTAL_KEY:-total}"
      EXTERNAL_API_INFER_HAS_MORE_FROM_PAGE_SIZE: "${EXTERNAL_API_INFER_HAS_MORE_FROM_PAGE_SIZE:-false}"
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      DOCS_ENABLED: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
